<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>3D DZ - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#862200",
                        "on-primary": "#5f1500",
                        "surface-bright": "#37393f",
                        "primary-container": "#ff6a3d",
                        "surface-variant": "#33353a",
                        "on-tertiary-fixed": "#151b2a",
                        "on-secondary-fixed-variant": "#004e5a",
                        "surface-container-low": "#1a1b21",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#3b0a00",
                        "secondary-fixed-dim": "#2fd9f4",
                        "secondary-fixed": "#a2eeff",
                        "on-background": "#e2e2e9",
                        "surface": "#111318",
                        "tertiary-fixed-dim": "#c0c6da",
                        "on-error-container": "#ffdad6",
                        "primary": "#ffb59f",
                        "secondary": "#5de6ff",
                        "on-secondary": "#00363e",
                        "on-error": "#690005",
                        "primary-fixed": "#ffdbd1",
                        "on-tertiary": "#2a3040",
                        "tertiary-fixed": "#dce2f7",
                        "surface-container-lowest": "#0c0e13",
                        "on-surface": "#e2e2e9",
                        "surface-container": "#1e1f25",
                        "secondary-container": "#00cbe6",
                        "surface-container-high": "#282a2f",
                        "primary-fixed-dim": "#ffb59f",
                        "inverse-surface": "#e2e2e9",
                        "tertiary-container": "#9399ac",
                        "on-tertiary-fixed-variant": "#404757",
                        "on-secondary-container": "#00515d",
                        "outline": "#a98a81",
                        "surface-dim": "#111318",
                        "surface-tint": "#ffb59f",
                        "tertiary": "#c0c6da",
                        "inverse-on-surface": "#2e3036",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#2b3141",
                        "on-secondary-fixed": "#001f25",
                        "inverse-primary": "#ae3104",
                        "surface-container-highest": "#33353a",
                        "on-surface-variant": "#e1bfb6",
                        "outline-variant": "#59413a",
                        "on-primary-container": "#611600",
                        "background": "#111318"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "stack-sm": "12px",
                        "container-max": "1440px",
                        "gutter": "24px",
                        "stack-md": "24px",
                        "margin-mobile": "16px",
                        "base": "8px",
                        "stack-lg": "48px"
                    },
                    "fontFamily": {
                        "display-lg": ["Sora"],
                        "tech-label": ["JetBrains Mono"],
                        "body-md": ["Sora"],
                        "headline-md": ["Sora"],
                        "display-lg-mobile": ["Sora"],
                        "body-lg": ["Sora"],
                        "price-display": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "tech-label": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "price-display": ["20px", { "lineHeight": "24px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glow {
            box-shadow: 0 0 60px -15px rgba(255, 106, 61, 0.4);
        }
        .input-glow:focus {
            box-shadow: 0 0 10px 0 rgba(93, 230, 255, 0.5);
            border-color: #5de6ff;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex antialiased">
<!-- Split Screen Container -->
<main class="w-full flex flex-col md:flex-row h-screen">
<!-- Left Visual Side (Hidden on Mobile) -->
<section class="hidden md:flex flex-1 relative items-center justify-center overflow-hidden bg-surface-container-low border-r border-white/5">
<!-- Ambient Glow Behind Image -->
<div class="absolute inset-0 bg-primary-container/10 mix-blend-screen opacity-50 blur-[100px]"></div>
<img class="w-full h-full object-cover relative z-10 opacity-80 mix-blend-luminosity hover:mix-blend-normal transition-all duration-700" data-alt="A highly detailed, photorealistic 3D render of a futuristic 3D printer actively printing a complex geometric object. The scene is lit with dramatic, moody lighting in a dark tech-focused environment. Intense neon orange (#FF6A3D) and electric cyan (#5de6ff) lights illuminate the printing bed and the extruder mechanism. The style is cinematic, ultra-crisp, and conveys a sense of high-performance manufacturing." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBRO4ofO1Xug-tKEppulfEYbdYeOQX6xebjDZpHIFVTHsqMYbswrZvJlsEHho39NlHLud8K0c3DP6se7eQbVWVPoPRKajIo4rGl7rjEVB2edU29jeMiXomAsTtuHoRx9P9Fi9Ea5_5cYf-oegL4oHpVtgoN-OOCZKexPUJ4K5t5ur3JJavleAWfX5iMXCXL50hddlGV4EisH0h7Xh7PBA8mc8oSe4wJ4Q7wFetw2mxyi7jKrsDjEO5D"/>
<!-- Overlay Brand Text -->
<div class="absolute bottom-margin-desktop left-margin-desktop z-20">
<h2 class="font-display-lg text-display-lg text-primary tracking-tighter drop-shadow-[0_0_15px_rgba(255,106,61,0.5)]">3D DZ</h2>
<p class="font-tech-label text-tech-label text-secondary mt-base uppercase tracking-widest">Manufacturing the Future</p>
</div>
</section>
<!-- Right Form Side -->
<section class="flex-1 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-background relative overflow-hidden">
<!-- Subtle background mesh/texture for the right side -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#e2e2e9 1px, transparent 1px); background-size: 24px 24px;"></div>
<!-- Glassmorphism Card -->
<div class="relative z-10 w-full max-w-md bg-surface-container/70 backdrop-blur-xl border border-white/10 rounded-xl p-8 shadow-[0_0_40px_-15px_rgba(255,106,61,0.2)]">
<!-- Mobile Logo (Visible only on mobile) -->
<div class="md:hidden text-center mb-stack-md">
<h2 class="font-display-lg-mobile text-display-lg-mobile font-black text-primary tracking-tighter">3D DZ</h2>
</div>
<div class="text-center mb-stack-lg">
<h1 class="font-headline-md text-headline-md text-on-surface">Access the Grid</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-base">Initialize your session to manage assets.</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-tech-label text-tech-label text-on-surface-variant mb-base" for="email">IDENTIFIER [EMAIL]</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-3 py-3 bg-surface-dim border border-outline-variant rounded-lg text-on-surface placeholder-outline focus:outline-none input-glow transition-all font-body-md" id="email" name="email" placeholder="operator@3ddz.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-base">
<label class="block font-tech-label text-tech-label text-on-surface-variant" for="password">PASSCODE</label>
<a class="font-tech-label text-tech-label text-secondary hover:text-secondary-container transition-colors" href="#">Recover?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-3 py-3 bg-surface-dim border border-outline-variant rounded-lg text-on-surface placeholder-outline focus:outline-none input-glow transition-all font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant bg-surface-dim text-primary focus:ring-secondary focus:ring-offset-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                            Maintain Link
                        </label>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-container hover:bg-primary-fixed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary bg-glow transition-all active:scale-95" type="submit">
<span class="font-tech-label text-tech-label tracking-widest uppercase">Engage</span>
<span class="material-symbols-outlined ml-2 text-base">login</span>
</button>
</form>
<!-- Switch to Register -->
<div class="mt-stack-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        New Operator? 
                        <a class="font-tech-label text-tech-label text-secondary hover:text-secondary-fixed transition-colors ml-2 border-b border-secondary/30 hover:border-secondary pb-0.5" href="#">
                            Request Access
                        </a>
</p>
</div>
</div>
<!-- Bottom decorative HUD line -->
<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
</section>
</main>
</body></html>
